name: Report a crash
description: Cherry is crashing or freezing or hanging.
type: Crash
labels: "state:needs triage"
body:
  - type: textarea
    attributes:
      label: Reproduction steps
      description: A step-by-step description of how to reproduce the crash from a **clean Cherry install**. The more context you provide, the easier it is to find and fix the problem fast.
      placeholder: |
        1. Start Cherry
        2. Perform an action
        3. Cherry crashes
    validations:
      required: true
  - type: textarea
    attributes:
      label: Cherry version and system specs
      description: |
        Open the command palette in Cherry, then type “cherry: copy system specs into clipboard”.
      placeholder: |
        Cherry: v0.215.0 (Cherry Nightly bfe141ea79aa4984028934067ba75c48d99136ae)
        OS: macOS 15.1
        Memory: 36 GiB
        Architecture: aarch64
    validations:
      required: true
  - type: textarea
    attributes:
      label: Attach Cherry log file
      description: |
        Open the command palette in Cherry, then type `cherry: open log` to see the last 1000 lines. Or type `cherry: reveal log in file manager` in the command palette to reveal the log file itself.
      value: |
        <details><summary>Cherry.log</summary>

        <!-- Paste your log inside the code block. -->
        ```log

        ```

        </details>
    validations:
      required: false
