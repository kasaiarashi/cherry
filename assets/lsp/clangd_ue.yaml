# Clangd configuration for Unreal Engine projects (fallback template)
# Placeholders: {{ENGINE_PATH}}, {{PROJECT_PATH}}, {{CORE_MINIMAL_PATH}}
# Based on unreal-clangd VSCode extension configuration

---
If:
  PathMatch:
    - .cherry/completionHelper.cpp
    - Plugins/.*\.(cpp|h|hpp|inl)
    - Source/.*\.(cpp|h|hpp|inl)
CompileFlags:
  CompilationDatabase: .cherry
  Add:
    - /std:c++20
    - /TP
    - -Wno-enum-enum-conversion
    - -Wno-enum-float-conversion
    - -Wno-ambiguous-reversed-operator
    - -Wno-deprecated-anon-enum-enum-conversion
    - -Wno-deprecated-volatile
    - -Wno-unused-but-set-variable
    - -Wno-unused-but-set-parameter
    - -Wno-ordered-compare-function-pointers
    - -Wno-bitwise-instead-of-logical
    - -Wno-gnu-string-literal-operator-template
    - -Wno-inconsistent-missing-override
    - -Wno-invalid-offsetof
    - -Wno-switch
    - -Wno-tautological-compare
    - -Wno-unknown-pragmas
    - -Wno-unused-function
    - -Wno-unused-lambda-capture
    - -Wno-unused-local-typedef
    - -Wno-unused-private-field
    - -Wno-unused-variable
    - -Wno-undefined-var-template
    - -Wno-float-conversion
    - -Wno-implicit-float-conversion
    - -Wno-implicit-int-conversion
    - -Wno-c++11-narrowing
    - -Wno-microsoft
    - -Wno-msvc-include
    - -Wno-pragma-pack
    - -Wno-inline-new-delete
    - -Wno-implicit-exception-spec-mismatch
    - -Wno-undefined-bool-conversion
    - -Wno-deprecated-writable-strings
    - -Wno-deprecated-register
    - -Wno-switch-enum
    - -Wno-logical-op-parentheses
    - -Wno-null-arithmetic
    - -Wno-deprecated-declarations
    - -Wno-return-type-c-linkage
    - -Wno-ignored-attributes
    - -Wno-uninitialized
    - -Wno-return-type
    - -Wno-unused-parameter
    - -Wno-ignored-qualifiers
    - -Wno-expansion-to-defined
    - -Wno-sign-compare
    - -Wno-missing-field-initializers
    - -Wno-nonportable-include-path
    - -Wno-invalid-token-paste
    - -Wno-null-pointer-arithmetic
    - -Wno-constant-logical-operand
    - -Wno-unused-value
    - -Wno-bitfield-enum-conversion
  Remove:
    - /FI*
    - /Yu*
    - /Yc*
    - /Fp*
    - /EH*
    - /GR*
    - /W*
    - /wd*
    - /we*
    - /Zc:*
    - /permissive*
    - /JMC
    - /ZI
    - /Zi
    - /FS
    - /MP*
    - -m32
    - -m64
InlayHints:
  Enabled: Yes
  DeducedTypes: Yes
  ParameterNames: Yes
  Designators: Yes
Diagnostics:
  UnusedIncludes: None
  ClangTidy:
    Remove: '*'
  Suppress:
    - builtin_definition
    - pp_file_not_found
    - incomplete_nested_name_spec
    - use_of_tag_name_without_tag
    - "*"
